[package]
name = "remotedeck-core"
version = "2.1.0"
description = "Native SSH workspace business core for RemoteDeck"
authors = ["RemoteDeck contributors"]
license = "MIT"
repository = "https://github.com/shilittle/RemoteDeck"
edition = "2024"
rust-version = "1.88"

[dependencies]
base64 = "0.22"
chrono = { version = "0.4", features = ["clock", "serde"] }
parking_lot = "0.12"
portable-pty = "0.9.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["io-util", "macros", "process", "rt-multi-thread", "sync", "time"] }
uuid = { version = "1", features = ["serde", "v4"] }
zip = { version = "4.0", default-features = false, features = ["deflate"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem", "Win32_System_SystemInformation"] }

[features]
default = []
openssh-integration = []
