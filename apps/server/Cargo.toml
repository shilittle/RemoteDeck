[package]
name = "remotedeck-server"
version = "2.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
description = "RemoteDeck local SSH workspace service"

[[bin]]
name = "RemoteDeck"
path = "src/main.rs"

[dependencies]
remotedeck-core = { path = "../../crates/remotedeck-core" }
axum = { version = "=0.8.9", features = ["ws", "json"] }
tokio = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde", "clock"] }
sha2 = "0.10"
parking_lot = "0.12"
uuid = { version = "1", features = ["v4", "serde"] }
futures-util = "0.3"
include_dir = "0.7"
mime_guess = "2"
reqwest = { version = "0.12", default-features = false, features = ["json"] }

[target.'cfg(target_os = "linux")'.dependencies]
rfd = { version = "=0.17.2", default-features = false, features = ["xdg-portal"] }

[target.'cfg(not(target_os = "linux"))'.dependencies]
rfd = { version = "=0.17.2", default-features = false }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Security", "Win32_Security_Cryptography", "Win32_System_Threading", "Win32_System_DataExchange", "Win32_System_LibraryLoader", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
tempfile = "3"
