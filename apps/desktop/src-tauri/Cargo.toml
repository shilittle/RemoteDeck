[package]
name = "remotedeck"
version = "2.0.0-alpha.1"
description = "A lightweight Tauri 2 SSH workspace"
authors = ["RemoteDeck contributors"]
license = "MIT"
repository = "https://github.com/shilittle/RemoteDeck"
edition = "2024"
rust-version = "1.85"

[lib]
name = "remotedeck_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.6.2", features = [] }

[dependencies]
base64 = "0.22"
chrono = { version = "0.4", features = ["clock", "serde"] }
parking_lot = "0.12"
portable-pty = "0.9.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tauri = { version = "=2.11.2", features = [] }
thiserror = "2"
tokio = { version = "1", features = ["macros", "process", "rt-multi-thread", "time"] }
uuid = { version = "1", features = ["serde", "v4"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
openssh-integration = []

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = "symbols"
