appId: io.github.shilittle.remotedeck
productName: RemoteDeck
executableName: RemoteDeck
asar: true
compression: maximum
# pnpm installs the matching Windows Electron runtime locally; using it makes
# release builds reproducible and removes an unnecessary network download.
electronDist: ../../node_modules/.pnpm/electron@43.2.0/node_modules/electron/dist
directories:
  output: release
  buildResources: build
files:
  - out/**/*
  - package.json
extraResources:
  - from: ../../packages/remote-collector/collector.py
    to: remote-collector/collector.py
afterPack: scripts/after-pack.cjs
win:
  icon: build/icon.ico
  target:
    - nsis
    - portable
nsis:
  artifactName: ${productName}-${version}-win-${arch}-setup.${ext}
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  deleteAppDataOnUninstall: false
  perMachine: false
  runAfterFinish: true
portable:
  artifactName: ${productName}-${version}-win-${arch}-portable.${ext}
