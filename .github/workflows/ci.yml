name: CI

on:
  push:
    branches: [main, "agent/**"]
  pull_request:

permissions:
  contents: read

jobs:
  frontend-quality:
    name: Frontend quality (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.9.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm test:integration
      - run: pnpm build

  rust-quality:
    name: Rust core (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.9.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Install Rust components
        shell: pwsh
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable
          cargo install cargo-audit --version 0.22.2 --locked
      - name: Audit Rust dependencies
        run: cargo audit --file apps/desktop/src-tauri/Cargo.lock
      - run: cargo fmt --manifest-path apps/desktop/src-tauri/Cargo.toml --all -- --check
      - run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml --all-features
      - name: Strict Clippy (ignore rustc's localized MSVC linker status message)
        run: cargo clippy --manifest-path apps/desktop/src-tauri/Cargo.toml --all-targets --all-features -- -D warnings -A linker-messages

  openssh-integration:
    name: Real OpenSSH integration (Ubuntu containers)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust and Tauri Linux prerequisites
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential \
            file \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            patchelf
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Run production OpenSSH paths against direct, jump and target fixtures
        shell: bash
        run: bash apps/desktop/scripts/run-openssh-integration.sh

  windows-bundle:
    name: Windows NSIS bundle, launch smoke and size gate
    runs-on: windows-latest
    needs: [frontend-quality, rust-quality, openssh-integration]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.9.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Rust and Tauri CLI
        shell: pwsh
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          cargo install tauri-cli --version 2.11.2 --locked
      - run: pnpm dist:win
      - name: Smoke-launch packaged Tauri binary
        shell: pwsh
        run: |
          $binary = Resolve-Path 'apps/desktop/src-tauri/target/release/remotedeck.exe'
          $process = Start-Process -FilePath $binary -PassThru
          try {
            $windowReady = $false
            for ($attempt = 0; $attempt -lt 40; $attempt++) {
              Start-Sleep -Milliseconds 500
              $process.Refresh()
              if ($process.HasExited) {
                throw "RemoteDeck exited before opening a window with code $($process.ExitCode)."
              }
              if ($process.MainWindowHandle -ne 0) {
                $windowReady = $true
                break
              }
            }
            if (-not $windowReady) { throw 'RemoteDeck process stayed alive but did not create a main window.' }
            Write-Host "RemoteDeck main window handle: $($process.MainWindowHandle)"
          } finally {
            if (-not $process.HasExited) {
              Stop-Process -Id $process.Id -Force
              $process.WaitForExit()
            }
          }
      - name: Enforce lightweight installer
        shell: pwsh
        run: |
          $installer = Get-ChildItem -LiteralPath apps/desktop/src-tauri/target/release/bundle/nsis -Filter '*.exe' | Select-Object -First 1
          if ($null -eq $installer) { throw 'Tauri NSIS installer not found.' }
          $limit = 40MB
          if ($installer.Length -ge $limit) { throw "Installer is $($installer.Length) bytes; limit is $limit bytes." }
          Write-Host "RemoteDeck installer: $([math]::Round($installer.Length / 1MB, 2)) MiB"
      - uses: actions/upload-artifact@v7
        with:
          name: RemoteDeck-2.0.0-windows-x64
          path: apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
