name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: Quality (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.9.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm test:integration
      - run: pnpm build

  openssh-integration:
    name: Docker OpenSSH integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.9.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: docker build -t remotedeck-openssh tests/fixtures/openssh
      - run: docker run --rm -d --name remotedeck-openssh -p 127.0.0.1:22222:22 -p 127.0.0.1:17890:17890 remotedeck-openssh
      - name: Wait for OpenSSH
        shell: bash
        run: |
          for attempt in {1..30}; do
            if bash -c '</dev/tcp/127.0.0.1/22222' 2>/dev/null; then exit 0; fi
            sleep 1
          done
          docker logs remotedeck-openssh
          exit 1
      - run: pnpm --filter @remotedeck/desktop test:integration:openssh
        env:
          REMOTEDECK_OPENSSH_HOST: 127.0.0.1
          REMOTEDECK_OPENSSH_PORT: 22222
          REMOTEDECK_REMOTE_FORWARD_PORT: 17890
      - if: always()
        run: docker stop remotedeck-openssh || true

  windows-release-candidate:
    name: Windows E2E and release artifacts
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.9.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:e2e
      - run: pnpm dist:win
      - name: Portable launch smoke
        shell: pwsh
        run: |
          $portable = Get-ChildItem -LiteralPath apps/desktop/release -Filter '*portable.exe' | Select-Object -First 1
          if ($null -eq $portable) { throw 'Portable artifact not found.' }
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File ./tests/manual/m9-packaged-smoke.ps1 -PortablePath $portable.FullName
      - name: Clean NSIS install smoke
        shell: pwsh
        run: |
          $installer = Get-ChildItem -LiteralPath apps/desktop/release -Filter '*setup.exe' | Select-Object -First 1
          if ($null -eq $installer) { throw 'NSIS artifact not found.' }
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File ./tests/manual/m9-clean-install.ps1 -InstallerPath $installer.FullName
      - uses: actions/upload-artifact@v6
        with:
          name: RemoteDeck-1.0.0-windows-x64
          path: |
            apps/desktop/release/*.exe
            apps/desktop/release/*.blockmap
          if-no-files-found: error
