name: CI

on:
  push:
    branches: [main, "agent/**"]
  pull_request:

permissions:
  contents: read

jobs:
  frontend-quality:
    name: Frontend quality (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.9.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm test:integration
      - run: pnpm build

  rust-quality:
    name: Rust core (Windows)
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Commit deterministic Clippy cleanup
        if: github.event_name == 'push' && github.ref == 'refs/heads/agent/tauri2-rewrite'
        shell: pwsh
        run: |
          $sessionPath = 'apps/desktop/src-tauri/src/session.rs'
          $session = Get-Content -LiteralPath $sessionPath -Raw
          $session = $session -replace ', PtySystem', ''
          Set-Content -LiteralPath $sessionPath -Value $session -NoNewline

          $tunnelPath = 'apps/desktop/src-tauri/src/tunnel.rs'
          $tunnel = Get-Content -LiteralPath $tunnelPath -Raw
          $tunnel = $tunnel -replace 'if let Some\(mut stderr\)', 'if let Some(stderr)'
          Set-Content -LiteralPath $tunnelPath -Value $tunnel -NoNewline

          $modelPath = 'apps/desktop/src-tauri/src/model.rs'
          $model = Get-Content -LiteralPath $modelPath -Raw
          $model = $model -replace '(?m)^\s+Closed,\r?\n', ''
          Set-Content -LiteralPath $modelPath -Value $model -NoNewline

          $storePath = 'apps/desktop/src-tauri/src/store.rs'
          $store = Get-Content -LiteralPath $storePath -Raw
          $store = $store -replace '(?m)^\s+directory: PathBuf,\r?\n', ''
          $store = $store -replace '(?m)^\s+directory,\r?\n', ''
          $store = $store -replace '(?ms)^\s+pub fn app_data_directory\(&self\) -> &Path \{\r?\n\s+&self\.directory\r?\n\s+\}\r?\n', ''
          Set-Content -LiteralPath $storePath -Value $store -NoNewline

          cargo fmt --manifest-path apps/desktop/src-tauri/Cargo.toml --all
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/desktop/src-tauri/src/*.rs
          if (-not (git diff --cached --quiet)) {
            git commit -m "fix: clear Rust lint blockers"
            git push origin HEAD:agent/tauri2-rewrite
          }
      - uses: pnpm/action-setup@v6
        with:
          version: 11.9.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Install Rust components
        shell: pwsh
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable
      - run: cargo fmt --manifest-path apps/desktop/src-tauri/Cargo.toml --all -- --check
      - run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml --all-features
      - run: cargo clippy --manifest-path apps/desktop/src-tauri/Cargo.toml --all-targets --all-features -- -D warnings

  windows-bundle:
    name: Windows NSIS bundle and size gate
    runs-on: windows-latest
    needs: [frontend-quality, rust-quality]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.9.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Rust and Tauri CLI
        shell: pwsh
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          cargo install tauri-cli --version 2.11.2 --locked
      - run: pnpm dist:win
      - name: Enforce lightweight installer
        shell: pwsh
        run: |
          $installer = Get-ChildItem -LiteralPath apps/desktop/src-tauri/target/release/bundle/nsis -Filter '*.exe' | Select-Object -First 1
          if ($null -eq $installer) { throw 'Tauri NSIS installer not found.' }
          $limit = 40MB
          if ($installer.Length -ge $limit) { throw "Installer is $($installer.Length) bytes; limit is $limit bytes." }
          Write-Host "RemoteDeck installer: $([math]::Round($installer.Length / 1MB, 2)) MiB"
      - uses: actions/upload-artifact@v6
        with:
          name: RemoteDeck-2.0.0-alpha.1-windows-x64
          path: apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
