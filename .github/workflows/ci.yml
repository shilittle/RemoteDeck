name: CI

on:
  push:
    branches: [main, "agent/**"]
  pull_request:

permissions:
  contents: read

jobs:
  frontend-quality:
    name: Frontend quality (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.9.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm test:integration
      - run: pnpm build

  rust-quality:
    name: Rust core (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.9.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Install Rust components
        shell: pwsh
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable
      - run: cargo fmt --manifest-path apps/desktop/src-tauri/Cargo.toml --all -- --check
      - name: Rust tests
        id: rust_tests
        continue-on-error: true
        run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml --all-features > cargo-test.log 2>&1
      - name: Upload Rust test diagnostics
        if: steps.rust_tests.outcome == 'failure'
        uses: actions/upload-artifact@v6
        with:
          name: cargo-test-windows
          path: cargo-test.log
          if-no-files-found: error
      - name: Rust clippy
        id: rust_clippy
        continue-on-error: true
        run: cargo clippy --manifest-path apps/desktop/src-tauri/Cargo.toml --all-targets --all-features -- -D warnings > clippy.log 2>&1
      - name: Upload clippy diagnostics
        if: steps.rust_clippy.outcome == 'failure'
        uses: actions/upload-artifact@v6
        with:
          name: clippy-windows
          path: clippy.log
          if-no-files-found: error
      - name: Enforce Rust checks
        if: steps.rust_tests.outcome == 'failure' || steps.rust_clippy.outcome == 'failure'
        run: exit 1

  windows-bundle:
    name: Windows NSIS bundle and size gate
    runs-on: windows-latest
    needs: [frontend-quality, rust-quality]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.9.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Rust and Tauri CLI
        shell: pwsh
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          cargo install tauri-cli --version 2.11.2 --locked
      - run: pnpm dist:win
      - name: Enforce lightweight installer
        shell: pwsh
        run: |
          $installer = Get-ChildItem -LiteralPath apps/desktop/src-tauri/target/release/bundle/nsis -Filter '*.exe' | Select-Object -First 1
          if ($null -eq $installer) { throw 'Tauri NSIS installer not found.' }
          $limit = 40MB
          if ($installer.Length -ge $limit) { throw "Installer is $($installer.Length) bytes; limit is $limit bytes." }
          Write-Host "RemoteDeck installer: $([math]::Round($installer.Length / 1MB, 2)) MiB"
      - uses: actions/upload-artifact@v6
        with:
          name: RemoteDeck-2.0.0-alpha.1-windows-x64
          path: apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
