name: CI

on:
  push:
    branches: [main, "agent/**", "codex/**"]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  frontend-quality:
    name: WebUI quality (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.9.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Audit frontend dependencies
        if: runner.os == 'Linux'
        run: pnpm audit --audit-level high
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - name: Install Linux XDG portal dependency
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libdbus-1-3 libdbus-1-dev pkg-config
          pkg-config --modversion dbus-1
      - name: Build WebUI assets required by the Rust server
        run: pnpm --filter @remotedeck/web build
      - run: pnpm test:integration
      - name: Install Chromium for browser E2E
        run: pnpm --filter @remotedeck/web exec playwright install chromium
      - name: Browser E2E
        run: pnpm test:e2e
      - run: pnpm build

  rust-quality:
    name: Rust workspace quality (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.9.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - name: Build embedded WebUI assets
        shell: pwsh
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter @remotedeck/web build
      - name: Install Rust components
        shell: pwsh
        run: |
          rustup toolchain install 1.98.0 --profile minimal --component rustfmt,clippy
          rustup default 1.98.0
      - name: Install cargo-audit
        shell: pwsh
        # This is a validation tool, not a shipped binary. Avoid spending most
        # of a clean Windows job optimizing the auditor before tests can run.
        run: cargo install cargo-audit --version 0.22.2 --locked --debug
      - name: Audit Rust dependencies
        shell: pwsh
        run: cargo audit --file Cargo.lock
      - name: Check Rust formatting
        run: cargo fmt --all -- --check
      - name: Run Rust tests
        run: cargo test --workspace --all-features
      - name: Strict Clippy (ignore rustc's localized MSVC linker status message)
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings -A linker-messages

  openssh-integration:
    name: Real OpenSSH integration (Ubuntu containers)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install integration prerequisites
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends openssh-client openssh-server libdbus-1-3 libdbus-1-dev pkg-config
          pkg-config --modversion dbus-1
          docker compose version
          rustup toolchain install 1.98.0 --profile minimal
          rustup default 1.98.0
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.9.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - name: Build embedded WebUI assets for the Linux server
        shell: bash
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter @remotedeck/web build
      - name: Install browser and Linux browser dependencies
        run: pnpm --filter @remotedeck/web exec playwright install --with-deps chromium
      - name: Run OpenSSH fixtures and real browser recovery workflows
        shell: bash
        run: pnpm test:e2e:openssh

  windows-bundle:
    name: Windows NSIS bundle, service readiness and size gate
    runs-on: windows-latest
    needs: [frontend-quality, rust-quality, openssh-integration]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.9.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Rust build components
        shell: pwsh
        run: |
          rustup toolchain install 1.98.0 --profile minimal
          rustup default 1.98.0
      - name: Install NSIS independently of any legacy cache
        shell: pwsh
        run: |
          choco install nsis --yes --no-progress
          $nsis = "${env:ProgramFiles(x86)}\NSIS\makensis.exe"
          if (-not (Test-Path -LiteralPath $nsis)) { $nsis = "$env:ProgramFiles\NSIS\makensis.exe" }
          & $nsis /VERSION
          if ($LASTEXITCODE -ne 0) { throw 'NSIS compiler verification failed.' }
      - name: Build current-user NSIS package
        run: pnpm dist:win
      - name: Clean install, loopback ready API and uninstall smoke test
        shell: pwsh
        run: |
          $installer = Get-ChildItem -LiteralPath dist -Filter '*-win-x64-setup.exe' -File | Select-Object -First 1
          if ($null -eq $installer) { throw 'NSIS installer not found under dist/.' }
          pwsh -NoProfile -File scripts/verify-release.ps1 -InstallerPath $installer.FullName
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: RemoteDeck-windows-x64
          path: |
            dist/*-win-x64-setup.exe
            dist/SHA256SUMS.txt
            dist/release-manifest.json
          if-no-files-found: error
