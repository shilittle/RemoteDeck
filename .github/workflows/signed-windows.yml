name: Signed Windows build

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Commit, branch, or tag to sign
        required: true
        default: main
        type: string

permissions:
  contents: read

jobs:
  signed-windows:
    name: Authenticode-signed Windows x64
    runs-on: windows-latest
    environment: release
    env:
      WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
      WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
      REMOTEDECK_SIGNER_SUBJECT: ${{ vars.REMOTEDECK_SIGNER_SUBJECT }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - uses: pnpm/action-setup@v6
        with:
          version: 11.9.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - name: Require Authenticode identity
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WIN_CSC_LINK)) {
            throw 'WIN_CSC_LINK is not configured in the release environment or repository secrets.'
          }
          if ([string]::IsNullOrWhiteSpace($env:WIN_CSC_KEY_PASSWORD)) {
            throw 'WIN_CSC_KEY_PASSWORD is not configured in the release environment or repository secrets.'
          }
          if ([string]::IsNullOrWhiteSpace($env:REMOTEDECK_SIGNER_SUBJECT)) {
            throw 'REMOTEDECK_SIGNER_SUBJECT is not configured in the release environment variables.'
          }
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify
      - run: pnpm test:e2e
      - run: pnpm dist:win:signed
      - run: pnpm verify:signatures
      - name: Portable launch smoke
        shell: pwsh
        run: |
          $portable = Get-ChildItem -LiteralPath apps/desktop/release -Filter '*portable.exe' | Select-Object -First 1
          if ($null -eq $portable) { throw 'Portable artifact not found.' }
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File ./tests/manual/m9-packaged-smoke.ps1 -PortablePath $portable.FullName
      - name: Clean NSIS install smoke
        shell: pwsh
        run: |
          $installer = Get-ChildItem -LiteralPath apps/desktop/release -Filter '*setup.exe' | Select-Object -First 1
          if ($null -eq $installer) { throw 'NSIS artifact not found.' }
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File ./tests/manual/m9-clean-install.ps1 -InstallerPath $installer.FullName
      - name: Write SHA-256 manifest
        shell: pwsh
        run: |
          $artifacts = Get-ChildItem -LiteralPath apps/desktop/release -File |
            Where-Object { $_.Name -like '*.exe' -or $_.Name -like '*.blockmap' } |
            Sort-Object Name
          if ($artifacts.Count -ne 3) { throw "Expected 3 release artifacts, found $($artifacts.Count)." }
          $lines = foreach ($artifact in $artifacts) {
            $hash = (Get-FileHash -LiteralPath $artifact.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($artifact.Name)"
          }
          $lines | Set-Content -LiteralPath apps/desktop/release/SHA256SUMS.txt -Encoding ascii
      - uses: actions/upload-artifact@v6
        with:
          name: RemoteDeck-signed-windows-x64-${{ github.run_id }}
          path: |
            apps/desktop/release/*.exe
            apps/desktop/release/*.blockmap
            apps/desktop/release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
