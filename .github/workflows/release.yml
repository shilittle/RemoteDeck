name: Release candidate

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  validate-source:
    name: Validate release source
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      version: ${{ steps.release.outputs.version }}
      source_commit: ${{ steps.release.outputs.source_commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate tag and package versions
        id: release
        shell: pwsh
        env:
          RELEASE_EVENT: ${{ github.event_name }}
          RELEASE_REF_NAME: ${{ github.ref_name }}
        run: |
          $rootVersion = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $webVersion = (Get-Content apps/web/package.json -Raw | ConvertFrom-Json).version
          $metadata = cargo metadata --no-deps --format-version 1 | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'cargo metadata failed.' }
          $serverVersion = ($metadata.packages | Where-Object name -eq 'remotedeck-server' | Select-Object -First 1).version
          $coreVersion = ($metadata.packages | Where-Object name -eq 'remotedeck-core' | Select-Object -First 1).version
          if (-not $serverVersion -or -not $coreVersion) { throw 'Expected remotedeck-server and remotedeck-core packages were not found.' }
          $versions = @($rootVersion, $webVersion, $serverVersion, $coreVersion) | Select-Object -Unique
          if ($versions.Count -ne 1) { throw "Version mismatch: root=$rootVersion web=$webVersion server=$serverVersion core=$coreVersion" }
          $sourceCommit = (git rev-parse HEAD).Trim()
          if ($sourceCommit -notmatch '^[0-9a-f]{40}$') { throw 'Checked-out source commit is invalid.' }
          if ($env:RELEASE_EVENT -eq 'push') {
            if ($env:RELEASE_REF_NAME -notmatch '^v[0-9]+\.[0-9]+\.[0-9]+(?:-[0-9A-Za-z.-]+)?$') { throw "Invalid release tag: $env:RELEASE_REF_NAME" }
            if ($env:RELEASE_REF_NAME.Substring(1) -ne $rootVersion) { throw 'Release tag does not match package version.' }
            if ((git cat-file -t "refs/tags/$env:RELEASE_REF_NAME").Trim() -ne 'tag') { throw 'Release tags must be annotated tag objects.' }
            if ((git rev-list -n 1 "refs/tags/$env:RELEASE_REF_NAME").Trim() -ne $sourceCommit) { throw 'Release tag does not point at the checked-out commit.' }
          }
          "version=$rootVersion" >> $env:GITHUB_OUTPUT
          "source_commit=$sourceCommit" >> $env:GITHUB_OUTPUT

  openssh-integration:
    name: Real OpenSSH integration
    needs: validate-source
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install integration prerequisites
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends openssh-client openssh-server libdbus-1-3 libdbus-1-dev pkg-config
          pkg-config --modversion dbus-1
          docker compose version
          rustup toolchain install stable --profile minimal
          rustup default stable
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.9.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - name: Build embedded WebUI assets for the Linux server
        shell: bash
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter @remotedeck/web build
      - name: Install browser and Linux browser dependencies
        run: pnpm --filter @remotedeck/web exec playwright install --with-deps chromium
      - name: Run OpenSSH fixtures and real browser recovery workflows
        shell: bash
        run: pnpm test:e2e:openssh

  windows-build:
    name: Build and verify Windows x64 NSIS candidate
    needs: validate-source
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.9.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Chromium for browser E2E
        run: pnpm --filter @remotedeck/web exec playwright install chromium
      - name: Install Rust build components
        shell: pwsh
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable
      - name: Install NSIS independently of any legacy cache
        shell: pwsh
        run: |
          choco install nsis --yes --no-progress
          makensis.exe /VERSION
      - name: Verify source before packaging
        run: pnpm verify
      - name: Build current-user NSIS package
        run: pnpm dist:win
      - name: Clean install, loopback ready API and uninstall smoke test
        shell: pwsh
        run: |
          $installer = Get-ChildItem -LiteralPath dist -Filter '*-win-x64-setup.exe' -File | Select-Object -First 1
          if ($null -eq $installer) { throw 'NSIS installer not found under dist/.' }
          pwsh -NoProfile -File scripts/verify-release.ps1 -InstallerPath $installer.FullName
      - name: Prepare checksummed release candidate assets
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ needs.validate-source.outputs.version }}
          SOURCE_COMMIT: ${{ needs.validate-source.outputs.source_commit }}
        run: |
          $source = Get-ChildItem -LiteralPath dist -Filter '*-win-x64-setup.exe' -File | Select-Object -First 1
          if ($null -eq $source) { throw 'NSIS installer not found while preparing release assets.' }
          $assetDir = New-Item -ItemType Directory -Path release-assets
          $assetName = "RemoteDeck-$env:RELEASE_VERSION-win-x64-setup.exe"
          $asset = Join-Path $assetDir.FullName $assetName
          Copy-Item -LiteralPath $source.FullName -Destination $asset
          $signature = Get-AuthenticodeSignature -LiteralPath $asset
          $hash = (Get-FileHash -LiteralPath $asset -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $assetName" | Set-Content -LiteralPath (Join-Path $assetDir.FullName 'SHA256SUMS.txt') -Encoding utf8NoBOM
          $manifest = [ordered]@{
            version = $env:RELEASE_VERSION
            platform = 'windows-x64'
            installer = $assetName
            sha256 = $hash
            bytes = (Get-Item -LiteralPath $asset).Length
            authenticodeStatus = [string]$signature.Status
            unsigned = ($signature.Status -eq 'NotSigned')
            sourceCommit = $env:SOURCE_COMMIT
            binary = 'RemoteDeck.exe'
            webAssets = 'embedded in RemoteDeck.exe'
            installerScope = 'currentUser'
            appData = '%APPDATA%\io.github.shilittle.remotedeck'
          }
          $manifest | ConvertTo-Json | Set-Content -LiteralPath (Join-Path $assetDir.FullName 'release-manifest.json') -Encoding utf8NoBOM
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: RemoteDeck-release-candidate-${{ github.sha }}
          path: release-assets/*
          if-no-files-found: error

  record-candidate:
    name: Record release candidate artifact
    if: always() && needs.validate-source.result == 'success' && needs.openssh-integration.result == 'success' && needs.windows-build.result == 'success'
    needs: [validate-source, openssh-integration, windows-build]
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: RemoteDeck-release-candidate-${{ github.sha }}
          path: release-assets
      - name: Verify candidate artifact inventory and digest
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.validate-source.outputs.version }}
          SOURCE_COMMIT: ${{ needs.validate-source.outputs.source_commit }}
        run: |
          set -euo pipefail
          expected="RemoteDeck-${RELEASE_VERSION}-win-x64-setup.exe"
          test -f "release-assets/$expected"
          test -f release-assets/SHA256SUMS.txt
          test -f release-assets/release-manifest.json
          (cd release-assets && sha256sum -c SHA256SUMS.txt)
          python3 - <<'PY'
          import hashlib, json, os, pathlib
          root = pathlib.Path('release-assets')
          name = f"RemoteDeck-{os.environ['RELEASE_VERSION']}-win-x64-setup.exe"
          manifest = json.loads((root / 'release-manifest.json').read_text())
          assert {item.name for item in root.iterdir()} == {name, 'SHA256SUMS.txt', 'release-manifest.json'}
          assert manifest['version'] == os.environ['RELEASE_VERSION']
          assert manifest['sourceCommit'] == os.environ['SOURCE_COMMIT']
          assert manifest['installer'] == name
          assert manifest['bytes'] == (root / name).stat().st_size
          assert manifest['bytes'] < 40 * 1024 * 1024
          assert manifest['sha256'] == hashlib.sha256((root / name).read_bytes()).hexdigest()
          assert manifest['installerScope'] == 'currentUser'
          PY
      - name: Explain publication boundary
        run: echo 'Release workflow records a verified NSIS candidate artifact only; publication requires an explicit authorized action outside this workflow.'
